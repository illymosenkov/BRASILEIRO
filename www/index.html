const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const localDay=(d=new Date())=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const emptyState=()=>({version:3,xp:0,streak:0,lastDay:'',days:{},words:{},sound:true});
let state;try{state={...emptyState(),...JSON.parse(localStorage.getItem('bora_civic_v3')||'{}')}}catch{state=emptyState()}
let screen='home',tab='verbs',dictionaryTab='all',session=null,audioCtx=null;
const verbs=DATA.verbs.map(v=>({...v,type:'verb',id:'v:'+v.inf}));
const topics=DATA.topics.map((t,i)=>({...t,id:'n'+i,words:t.words.map((w,j)=>({...w,type:'noun',id:'n:'+i+':'+j,topic:t.title}))}));
const allWords=[...verbs,...topics.flatMap(t=>t.words)];const byId=new Map(allWords.map(w=>[w.id,w]));
const packs=Array.from({length:30},(_,i)=>({id:'v'+i,title:i===0?'Первые слова':i===1?'Каждый день':i===17?'За рулём':i===18?'В гараже':'Глаголы · '+String(i+1).padStart(2,'0'),emoji:i===17?'🏎️':i===18?'🔧':'⚡',words:verbs.slice(i*10,i*10+10)}));
function save(){try{localStorage.setItem('bora_civic_v3',JSON.stringify(state))}catch{toast('Не удалось сохранить прогресс. Проверь свободное место.')}}
function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',3500)}
function initAudio(){try{audioCtx??=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch{}}
function sound(ok){if(!state.sound)return;initAudio();if(!audioCtx)return;try{const t=audioCtx.currentTime;const tones=ok?[[523.25,0,.12],[659.25,.10,.13],[783.99,.21,.23]]:[[220,0,.15],[164.81,.13,.22]];tones.forEach(([freq,delay,dur])=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=ok?'sine':'triangle';o.frequency.value=freq;g.gain.setValueAtTime(.0001,t+delay);g.gain.exponentialRampToValueAtTime(.14,t+delay+.015);g.gain.exponentialRampToValueAtTime(.0001,t+delay+dur);o.connect(g);g.connect(audioCtx.destination);o.start(t+delay);o.stop(t+delay+dur+.02)})}catch{}}
function toggleSound(){state.sound=!state.sound;save();renderSound();if(state.sound)sound(true)}
function renderSound(){$('sound').textContent=state.sound?'♪ Звук':'♪ Выкл.';$('sound').setAttribute('aria-pressed',String(state.sound))}
function mastered(w){return (state.words[w.id]?.wins||0)>=2}
function dueWords(){return allWords.filter(w=>state.words[w.id]&&state.words[w.id].due<=localDay())}
function mark(w,ok){let old=state.words[w.id]||{wins:0,interval:0};let interval=ok?Math.min(30,old.interval?old.interval*2:1):0;state.words[w.id]={wins:ok?old.wins+1:Math.max(0,old.wins-1),interval,due:localDay(new Date(Date.now()+interval*86400000))};save()}
function activity(){const now=localDay();if(state.lastDay!==now){const y=new Date();y.setDate(y.getDate()-1);state.streak=state.lastDay===localDay(y)?state.streak+1:1;state.lastDay=now}state.days[now]=(state.days[now]||0)+1;save()}
function activeStreak(){const y=new Date();y.setDate(y.getDate()-1);return [localDay(),localDay(y)].includes(state.lastDay)?state.streak:0}
function nav(){const items=[['home','⌂','Главная'],['learn','▦','Темы'],['dictionary','Aa','Словарь'],['profile','◉','Прогресс']];$('nav').innerHTML=items.map(([id,icon,title])=>`<button data-go="${id}" class="${screen===id?'active':''}"><span>${icon}</span>${title}</button>`).join('');$('nav').hidden=screen==='session';}
function go(s){if(screen==='session'&&session&&!session.finished&&s!=='session'&&!confirm('Выйти из урока? Уже полученный прогресс сохранён.'))return;screen=s;nav();renderSound();if(s==='home')home();if(s==='learn')learn();if(s==='dictionary')dictionary();if(s==='profile')profile();window.scrollTo(0,0)}
function progress(t){return Math.round(t.words.filter(mastered).length/t.words.length*100)}
function topicTile(t){const p=progress(t);return `<button class="topic" data-lesson="${t.id}"><span class="emoji">${t.emoji}</span><b>${esc(t.title)}</b><small>${t.words.length} слов · ${p}% закреплено</small><div class="mini"><i style="width:${p}%"></i></div></button>`}
function home(){let learned=allWords.filter(mastered).length,daily=state.days[localDay()]||0;let next=packs.find(p=>progress(p)<100)||packs[0];$('view').innerHTML=`<section class="hero"><img src="${HERO}" alt="Тёмно-зелёный Honda Civic на фоне заката в Рио"><div class="hero-copy"><div class="eyebrow">Твой маршрут в Бразилию</div><h1>Bora<br>aprender?</h1><p>Поехали учить живой португальский.<br>Одно слово — ещё один поворот.</p></div></section><div class="stats"><div class="stat"><b>${activeStreak()}</b><small>дней подряд</small></div><div class="stat"><b>${state.xp}</b><small>опыт · XP</small></div><div class="stat"><b>${learned}</b><small>слов закреплено</small></div></div><div class="content" style="padding-top:0"><div class="card daily"><div class="eyebrow">Ежедневный заезд</div><h2>${daily>=10?'Цель выполнена!':'10 ответов сегодня'}</h2><p>${Math.min(daily,10)} из 10 · небольшие шаги каждый день</p><div class="bar"><i style="width:${Math.min(daily/10,1)*100}%"></i></div><button class="btn wide" data-start="${next.id}">Продолжить маршрут →</button></div><div class="card"><div class="eyebrow">Pit stop · повторение</div><h3 style="margin:6px 0">${dueWords().length?dueWords().length+' слов ждут тебя':'Закрепим изученное'}</h3><p class="muted" style="margin:5px 0 15px">Ошибки возвращаются в тренировку.</p><button class="btn secondary wide" data-review>Повторить слова</button></div><div class="section-head"><h2>Твои направления</h2><button class="back" data-go="learn">Все темы →</button></div><div class="topic-grid">${topicTile(packs[0])}${topicTile(topics[9])}${topicTile(topics[10])}${topicTile(topics[0])}</div><p class="footnote">300 глаголов · ${topics.length} темы · ${topics.reduce((n,t)=>n+t.words.length,0)} существительных<br>Все уроки и звуки работают без интернета.</p></div>`}
function learn(){const list=tab==='verbs'?packs:topics;$('view').innerHTML=`<div class="content"><div class="eyebrow">Escolha seu caminho</div><h2 style="font-size:30px;margin:7px 0">Выбирай маршрут</h2><p class="muted">От первых слов до разговоров в гараже.</p><div class="chips" style="margin-top:20px"><button class="chip ${tab==='verbs'?'active':''}" data-tab="verbs">Глаголы · 300</button><button class="chip ${tab==='nouns'?'active':''}" data-tab="nouns">Существительные · ${topics.length} темы</button></div><div class="note-box">${tab==='verbs'?'В каждом наборе: инфинитив, форма <b>eu</b> в настоящем времени и русские подсказки произношения.':'Учи существительные вместе с артиклем: <b>o</b> — мужской род, <b>a</b> — женский. Это поможет строить фразы.'}</div><div class="topic-grid">${list.map(topicTile).join('')}</div></div>`}
function getLesson(id){return [...packs,...topics].find(t=>t.id===id)}
function pronunciationNote(){return '<p class="footnote">Русская запись приблизительная: заглавные слоги показывают ударение, знак ◌̃ — носовой звук. Звуки и ударения зависят от региона Бразилии.</p>'}
function wordRow(w){return `<div class="row"><span class="article">${w.type==='verb'?'инфинитив':w.word.startsWith('a ')?'женский род':'мужской род'}</span>${mastered(w)?'<span class="check">✓</span>':''}<div class="word">${esc(w.inf||w.word)}</div><div class="pron">${esc(w.pron)}</div>${w.type==='verb'?`<div class="form">eu ${esc(w.eu)}</div><div class="pron">эу ${esc(w.euPron)}</div>`:''}<div class="translation">${esc(w.meaning)}</div></div>`}
function lesson(id){const t=getLesson(id);if(!t)return;screen='lesson';nav();$('view').innerHTML=`<div class="content"><button class="back" data-go="learn">← Все маршруты</button><div class="lesson-head"><div class="lesson-icon">${t.emoji}</div><div><h2>${esc(t.title)}</h2><p class="muted">${t.words.length} слов · ${progress(t)}% закреплено</p></div></div><button class="btn wide" data-start="${t.id}">Начать тренировку →</button><div class="actions"><button class="btn secondary" data-flash="${t.id}">Карточки</button>${t.id.startsWith('v')?`<button class="btn secondary" data-write="${t.id}">Написать eu</button>`:''}</div><div class="card">${t.words.map(wordRow).join('')}</div>${pronunciationNote()}</div>`;window.scrollTo(0,0)}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function start(id,mode='quiz',words=null){const t=words?{id:'review',title:'Повторение',words}:getLesson(id);if(!t)return;initAudio();session={lesson:t,mode,queue:shuffle(t.words).map((w,i)=>({w,kind:mode==='write'?'write':w.type==='verb'&&(i%2===1)?'eu':'meaning',retry:false})),index:0,answered:false,revealed:false,firstRight:0,attempts:0,repeats:0,awarded:new Set(),finished:false};screen='session';nav();renderQuestion();window.scrollTo(0,0)}
function review(){const due=dueWords(),seen=allWords.filter(w=>state.words[w.id]);start(null,'quiz',(due.length?shuffle(due):seen.length?shuffle(seen):verbs).slice(0,10))}
function answerText(q,w=q.w){return q.kind==='meaning'?w.meaning:q.kind==='eu'?'eu '+w.eu:w.eu}
function renderQuestion(){let s=session;if(s.index>=s.queue.length){finish();return}const q=s.queue[s.index],w=q.w;s.answered=false;s.revealed=false;const p=s.index/s.queue.length*100;let body='';if(s.mode==='flash'){body=`<div class="card flash"><div class="eyebrow">${w.type==='verb'?'Инфинитив + presente':'Существительное'}</div><div class="question-word">${esc(w.inf||w.word)}</div><div class="pron">${esc(w.pron)}</div>${w.type==='verb'?`<div class="form">eu ${esc(w.eu)}</div><div class="pron">эу ${esc(w.euPron)}</div>`:''}<div id="flash-answer"></div></div><div id="flash-actions"><button class="btn wide" data-reveal>Показать перевод</button></div>`}else{const prompt=q.kind==='meaning'?'Как переводится это слово?':q.kind==='eu'?'Выбери форму «я» в настоящем':'Напиши форму eu';let options='';if(q.kind==='write'){options=`<form id="write-form"><label for="typed" class="muted">Пиши без eu. Ударения можно не вводить.</label><input class="input" id="typed" placeholder="eu …" autocomplete="off" autocapitalize="none" spellcheck="false"><button class="btn wide" type="submit">Проверить ответ</button></form>`}else{const pool=allWords.filter(x=>x.type===w.type&&x.id!==w.id);const distract=shuffle([...new Set(pool.map(x=>answerText(q,x)).filter(x=>x!==answerText(q)))]).slice(0,3);s.options=shuffle([answerText(q),...distract]);options=s.options.map((v,i)=>`<button class="option" data-choice="${i}">${esc(v)}</button>`).join('')}body=`<div class="question"><div class="eyebrow">${q.retry?'Ещё раз · закрепляем':q.kind==='meaning'?'Перевод':'Presente · eu'}</div><h2>${prompt}</h2><div class="question-card"><div class="question-word">${esc(w.inf||w.word)}</div><div class="pron">${esc(w.pron)}</div></div></div><div id="options">${options}</div><div id="feedback" role="status" aria-live="polite"></div>`}$('view').innerHTML=`<div class="content"><div class="session-top"><button class="back" data-go="learn" aria-label="Выйти из урока">✕</button><div class="bar"><i style="width:${p}%"></i></div><span class="session-count">${s.index+1}/${s.queue.length}</span></div><div class="pack-name">${esc(s.lesson.title)}</div>${body}<p class="footnote">${s.mode==='flash'?'Честно оценивай, вспомнил ли перевод.':'Звуки ответов можно отключить кнопкой ♪ сверху.'}</p></div>`}
const normalize=s=>String(s).trim().toLowerCase().replace(/^eu\s+/,'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ');
function choose(i){if(!session||session.answered)return;const q=session.queue[session.index];submitAnswer(session.options[i]===answerText(q),i)}
function writeAnswer(){if(!session||session.answered)return;const value=$('typed').value;if(!value.trim()){toast('Сначала напиши ответ.');$('typed').focus();return}const w=session.queue[session.index].w;submitAnswer(normalize(value)===normalize(w.eu));}
function submitAnswer(ok,choice){const s=session;if(!s||s.answered)return;s.answered=true;const q=s.queue[s.index],w=q.w;s.attempts++;if(ok&&!q.retry)s.firstRight++;if(!ok){s.queue.push({...q,retry:true});s.repeats++}mark(w,ok);activity();if(ok&&!s.awarded.has(w.id)){s.awarded.add(w.id);state.xp+=10;save()}sound(ok);document.querySelectorAll('.option').forEach((b,i)=>{b.disabled=true;if(s.options[i]===answerText(q))b.classList.add('correct');else if(i===choice)b.classList.add('wrong')});if($('typed')){$('typed').disabled=true;$('write-form').querySelector('button').disabled=true}const correct=w.type==='verb'?`${w.inf} → eu ${w.eu}`:w.word;const hint=w.type==='verb'?`${w.pron} → эу ${w.euPron}`:w.pron;if(s.mode==='flash'){next();return}$('feedback').className='feedback'+(ok?'':' bad');$('feedback').innerHTML=`<b>${ok?'Muito bem! Правильно':'Почти! Попробуем ещё раз'}</b><p>${esc(correct)}<br><span class="pron">${esc(hint)}</span><br>${esc(w.meaning)}</p><button class="btn wide" data-next>${s.index===s.queue.length-1?'Результат':'Дальше →'}</button>`;$('feedback').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'nearest'})}
function next(){if(!session?.answered)return;session.index++;renderQuestion();window.scrollTo(0,0)}
function reveal(){if(!session||session.revealed)return;session.revealed=true;$('flash-answer').innerHTML=`<div class="translation">${esc(session.queue[session.index].w.meaning)}</div>`;$('flash-actions').innerHTML='<div class="actions"><button class="btn danger" data-rate="0">Не вспомнил</button><button class="btn" data-rate="1">Знал ✓</button></div>'}
function finish(){const s=session;s.finished=true;save();const total=s.lesson.words.length;const accuracy=s.attempts?Math.round(s.firstRight/total*100):0;$('view').innerHTML=`<div class="content"><div class="result"><div class="celebrate">🏁</div><div class="eyebrow">Заезд завершён</div><h1>Boa, Илья!</h1><p>Ты прошёл «${esc(s.lesson.title)}».<br>${s.repeats?'Все ошибки разобраны повторно.':'Чистый круг — без ошибок!'}</p><div class="result-stats"><div><b>+${s.awarded.size*10}</b><small>XP за урок</small></div><div><b>${accuracy}%</b><small>с первого раза</small></div><div><b>${total}</b><small>слов пройдено</small></div></div><button class="btn wide" data-next-pack>Следующий маршрут →</button><div style="margin-top:14px"><button class="btn secondary wide" data-go="home">На главную</button></div><p class="footnote">Слово считается закреплённым после двух успешных ответов. Повторение доступно на главной.</p></div></div>`}
function nextPack(){const s=session,list=s.lesson.id.startsWith('v')?packs:topics;const ix=list.findIndex(t=>t.id===s.lesson.id);start(list[(ix+1)%list.length].id)}
function dictionary(){ $('view').innerHTML=`<div class="content"><div class="eyebrow">Seu vocabulário</div><h2 style="font-size:30px;margin:7px 0">Мой словарь</h2><p class="muted">${allWords.length} слов с русскими подсказками</p><div class="search"><input class="input" id="search" aria-label="Поиск слов" placeholder="falar, машина, говорить…"><div class="chips"><button class="chip ${dictionaryTab==='all'?'active':''}" data-dict="all">Все</button><button class="chip ${dictionaryTab==='verb'?'active':''}" data-dict="verb">Глаголы</button><button class="chip ${dictionaryTab==='noun'?'active':''}" data-dict="noun">Существительные</button></div></div><div class="muted" id="found"></div><div id="word-list" class="card" style="margin-top:14px"></div>${pronunciationNote()}</div>`;dictionaryResults()}
function dictionaryResults(){const q=($('search')?.value||'').trim().toLowerCase();const words=allWords.filter(w=>(dictionaryTab==='all'||w.type===dictionaryTab)&&[w.inf,w.word,w.eu,w.meaning,w.pron,w.euPron].filter(Boolean).join(' ').toLowerCase().includes(q));$('found').textContent='Найдено: '+words.length;$('word-list').innerHTML=words.length?words.map(wordRow).join(''):'<div class="empty">Ничего не найдено</div>'}
function exportProgress(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({app:'bora-civic',state},null,2)],{type:'application/json'}));a.download='bora-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function profile(){const n=allWords.filter(mastered).length;$('view').innerHTML=`<div class="content"><div class="eyebrow">Seu progresso</div><h2 style="font-size:30px;margin:7px 0 20px">Твой гараж прогресса</h2><img src="${HERO}" alt="Civic Edition" style="width:100%;border-radius:23px;margin-bottom:18px"><div class="card"><span class="badge">BORA · CIVIC EDITION 3.0</span><h2 style="margin:12px 0">${n} / ${allWords.length} слов</h2><div class="bar"><i style="width:${n/allWords.length*100}%"></i></div><div class="progress-numbers"><span>${state.xp} XP</span><span>${activeStreak()} дней подряд</span></div></div><div class="card"><div class="settings-row"><span>Звуки ответов</span><button class="btn secondary" data-sound>${state.sound?'Включены':'Выключены'}</button></div><div class="settings-row"><span>Проверить звук</span><div><button class="back" data-test="1">✓</button> <button class="back" data-test="0">✕</button></div></div><div class="settings-row"><span>Резервная копия</span><button class="back" data-export>Экспорт</button></div><div class="settings-row"><label for="import">Восстановить прогресс</label><input id="import" type="file" accept="application/json,.json" style="max-width:130px"></div></div><div class="note-box">Инфинитив — форма из словаря: <b>falar</b> (говорить).<br>Presente, eu — «я» сейчас: <b>eu falo</b> (я говорю).<br>Существительные идут с артиклями <b>o / a</b>.</div>${pronunciationNote()}<p class="footnote">Прогресс хранится на этом устройстве. Веб-версия и Android-приложение сохраняют его отдельно. Данные старого BRASILEIRO не удаляются.</p></div>`}
async function importProgress(file){try{const data=JSON.parse(await file.text());const s=data.state;if(data.app!=='bora-civic'||!s||typeof s.words!=='object'||!s.words||!Number.isSafeInteger(s.xp)||s.xp<0||!Number.isSafeInteger(s.streak)||s.streak<0||typeof s.days!=='object'||!s.days||typeof s.lastDay!=='string')throw Error();for(const [id,w]of Object.entries(s.words)){if(!byId.has(id)||!w||!Number.isFinite(w.wins)||w.wins<0||!Number.isFinite(w.interval)||w.interval<0||typeof w.due!=='string')throw Error()}if(!Object.values(s.days).every(n=>Number.isSafeInteger(n)&&n>=0))throw Error();if(!confirm('Заменить текущий прогресс данными из файла?'))return;state={...emptyState(),...s,sound:s.sound!==false};save();renderSound();profile();toast('Прогресс восстановлен')}catch{toast('Не удалось открыть файл прогресса Bora.')}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.go)go(d.go);else if(d.tab){tab=d.tab;learn()}else if(d.lesson)lesson(d.lesson);else if(d.start)start(d.start);else if(d.flash)start(d.flash,'flash');else if(d.write)start(d.write,'write');else if('review'in d)review();else if('choice'in d)choose(Number(d.choice));else if('next'in d)next();else if('reveal'in d)reveal();else if('rate'in d)submitAnswer(d.rate==='1');else if('nextPack'in d)nextPack();else if(d.dict){dictionaryTab=d.dict;dictionary()}else if('sound'in d){toggleSound();profile()}else if('test'in d)sound(d.test==='1');else if('export'in d)exportProgress()});
document.addEventListener('submit',e=>{if(e.target.id==='write-form'){e.preventDefault();writeAnswer()}});document.addEventListener('input',e=>{if(e.target.id==='search')dictionaryResults()});document.addEventListener('change',e=>{if(e.target.id==='import'&&e.target.files[0])importProgress(e.target.files[0])});$('sound').onclick=toggleSound;go('home');
</script></body></html>
